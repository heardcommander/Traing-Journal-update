# Titan Journal API — deploy this repo as a Railway service (not the Redis/Postgres templates alone).
# https://docs.railway.com/guides/monorepo

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
