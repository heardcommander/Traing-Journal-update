kind = "web"
previewPath = "/"
title = "Titan Journal"
version = "1.0.0"
id = "artifacts/titan-journal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18405

[services.development]
run = "pnpm --filter @workspace/titan-journal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/titan-journal", "run", "build" ]
publicDir = "artifacts/titan-journal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18405"
BASE_PATH = "/"
