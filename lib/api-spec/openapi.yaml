openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Titan Journal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trades
    description: Trade journal entries
  - name: stats
    description: Dashboard statistics
  - name: rituals
    description: Daily ritual items
  - name: ritual-completions
    description: Daily ritual completions
  - name: ai
    description: AI coaching and analysis
  - name: billing
    description: Subscriptions and payments

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all trades
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: setup
          in: query
          required: false
          schema:
            type: string
        - name: emotion
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Create a new trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/pnl-history:
    get:
      operationId: getPnlHistory
      tags: [stats]
      summary: Get daily PnL history for equity curve
      responses:
        "200":
          description: PnL history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PnlHistoryEntry"

  /trades/stats:
    get:
      operationId: getTradeStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStats"

  /trades/import:
    post:
      operationId: importTrades
      tags: [trades]
      summary: Import trades from CSV text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeImportResult"
        "400":
          description: Invalid CSV

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "404":
          description: Not found
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "404":
          description: Not found
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /rituals:
    get:
      operationId: listRituals
      tags: [rituals]
      summary: List all ritual items
      responses:
        "200":
          description: List of ritual items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ritual"
    post:
      operationId: createRitual
      tags: [rituals]
      summary: Create a ritual item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RitualInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ritual"

  /rituals/{id}:
    patch:
      operationId: updateRitual
      tags: [rituals]
      summary: Update a ritual item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RitualUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ritual"
        "404":
          description: Not found
    delete:
      operationId: deleteRitual
      tags: [rituals]
      summary: Delete a ritual item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /ritual-completions:
    get:
      operationId: listRitualCompletions
      tags: [ritual-completions]
      summary: List ritual completions for a date
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Date in YYYY-MM-DD format (defaults to today)
      responses:
        "200":
          description: List of completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RitualCompletion"
    post:
      operationId: createRitualCompletion
      tags: [ritual-completions]
      summary: Mark a ritual as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RitualCompletionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RitualCompletion"

  /ritual-completions/{id}:
    delete:
      operationId: deleteRitualCompletion
      tags: [ritual-completions]
      summary: Unmark a ritual completion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /ai/analyze:
    post:
      operationId: analyzeTrading
      tags: [ai]
      summary: Get AI coaching analysis of trading patterns
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeTradingRequest"
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysis"

  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get subscription status
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"

  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create Stripe Checkout session for Pro plan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "503":
          description: Stripe not configured

  /billing/portal:
    post:
      operationId: createBillingPortalSession
      tags: [billing]
      summary: Open Stripe customer portal
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: No customer
        "503":
          description: Stripe not configured

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Trade:
      type: object
      required: [id, pair, type, pnl, emotion, setup, tradedAt, createdAt]
      properties:
        id:
          type: integer
        pair:
          type: string
        type:
          type: string
          enum: [Buy, Sell]
        pnl:
          type: number
        emotion:
          type: string
        setup:
          type: string
        notes:
          type: ["string", "null"]
        lessonsLearned:
          type: ["string", "null"]
        marketSession:
          type: ["string", "null"]
        stopLoss:
          type: ["number", "null"]
        takeProfit:
          type: ["number", "null"]
        confidence:
          type: ["integer", "null"]
        rating:
          type: ["integer", "null"]
        tags:
          type: ["string", "null"]
        tradedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TradeInput:
      type: object
      required: [pair, type, pnl, emotion, setup]
      properties:
        pair:
          type: string
          minLength: 1
        type:
          type: string
          enum: [Buy, Sell]
        pnl:
          type: number
        emotion:
          type: string
          minLength: 1
        setup:
          type: string
          minLength: 1
        notes:
          type: string
        lessonsLearned:
          type: string
        marketSession:
          type: string
        stopLoss:
          type: number
        takeProfit:
          type: number
        confidence:
          type: integer
        rating:
          type: integer
        tags:
          type: string
        tradedAt:
          type: string
          format: date-time

    TradeUpdate:
      type: object
      properties:
        pair:
          type: string
          minLength: 1
        type:
          type: string
          enum: [Buy, Sell]
        pnl:
          type: number
        emotion:
          type: string
        setup:
          type: string
        notes:
          type: ["string", "null"]
        lessonsLearned:
          type: ["string", "null"]
        marketSession:
          type: ["string", "null"]
        stopLoss:
          type: ["number", "null"]
        takeProfit:
          type: ["number", "null"]
        confidence:
          type: ["integer", "null"]
        rating:
          type: ["integer", "null"]
        tags:
          type: ["string", "null"]
        tradedAt:
          type: string
          format: date-time

    TradeStats:
      type: object
      required: [totalPnl, winRate, bestSetup, totalTrades, wins, losses, riskDisciplineScore, setupBreakdown, emotionBreakdown]
      properties:
        totalPnl:
          type: number
        winRate:
          type: number
        bestSetup:
          type: ["string", "null"]
        totalTrades:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        riskDisciplineScore:
          type: number
        setupBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SetupStat"
        emotionBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/EmotionStat"

    PnlHistoryEntry:
      type: object
      required: [date, dailyPnl, cumulativePnl, tradeCount]
      properties:
        date:
          type: string
        dailyPnl:
          type: number
        cumulativePnl:
          type: number
        tradeCount:
          type: integer

    SetupStat:
      type: object
      required: [setup, count, totalPnl, winRate]
      properties:
        setup:
          type: string
        count:
          type: integer
        totalPnl:
          type: number
        winRate:
          type: number

    EmotionStat:
      type: object
      required: [emotion, count, totalPnl]
      properties:
        emotion:
          type: string
        count:
          type: integer
        totalPnl:
          type: number

    AnalyzeTradingRequest:
      type: object
      properties:
        dummy:
          type: string

    AiAnalysis:
      type: object
      required: [patterns, strengths, improvements, psychologyInsight, tipOfTheDay, generatedAt]
      properties:
        patterns:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        psychologyInsight:
          type: string
        tipOfTheDay:
          type: string
        generatedAt:
          type: string
          format: date-time

    Ritual:
      type: object
      required: [id, label, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        createdAt:
          type: string
          format: date-time

    RitualInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1

    RitualUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1

    RitualCompletion:
      type: object
      required: [id, ritualId, completedDate, createdAt]
      properties:
        id:
          type: integer
        ritualId:
          type: integer
        completedDate:
          type: string
        createdAt:
          type: string
          format: date-time

    RitualCompletionInput:
      type: object
      required: [ritualId]
      properties:
        ritualId:
          type: integer
        completedDate:
          type: string

    TradeImportInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          minLength: 1

    TradeImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    BillingFeatures:
      type: object
      required: [csvImport, ruleBasedAi, gptCoach, unlimitedTrades]
      properties:
        csvImport:
          type: boolean
        ruleBasedAi:
          type: boolean
        gptCoach:
          type: boolean
        unlimitedTrades:
          type: boolean

    BillingStatus:
      type: object
      required: [plan, stripeConfigured, features]
      properties:
        plan:
          type: string
          enum: [free, pro]
        email:
          type: ["string", "null"]
        currentPeriodEnd:
          type: ["string", "null"]
          format: date-time
        stripeConfigured:
          type: boolean
        features:
          $ref: "#/components/schemas/BillingFeatures"

    CheckoutInput:
      type: object
      properties:
        email:
          type: string
          format: email

    CheckoutSession:
      type: object
      required: [url]
      properties:
        url:
          type: string
