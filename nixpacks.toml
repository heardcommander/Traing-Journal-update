# Railway/Nixpacks: avoid corepack (breaks pnpm on some images).
# Install pnpm via npm, then use the lockfile.

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = [
  "npm install -g pnpm@11.1.2",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server run build"]
